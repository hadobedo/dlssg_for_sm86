# Builds the Wine/Proton compatibility shim and publishes a release that pairs
# it with the unmodified upstream runtime.
#
# Releases are tagged proton-<upstream version>, one per upstream version. A
# rebuild for a version that is already out refreshes that release in place.
#
# Two ways in:
#   * automatically, on a schedule: it polls upstream for a new release and,
#     when the runtime payload or this repo's own files changed, builds and
#     publishes without any human input;
#   * on demand: Actions, "Proton release", Run workflow, or
#       gh workflow run proton-release.yml -R <owner>/dlssg_for_sm86-proton
#
# One-time setup in a fresh fork:
#   1. Actions tab -> "I understand my workflows, go ahead and enable them".
#      GitHub disables workflows (and in particular scheduled ones) in forks
#      until this is done.
#   2. Settings -> Actions -> General -> Workflow permissions -> "Read and write
#      permissions" (the workflow pushes the release and updates main).
#   3. Either let the schedule run, or run it once by hand to inspect a bundle.
#
# The schedule is only a trigger. Whether a release is actually cut is decided
# from hashes: an identical upstream payload plus identical local sources means
# no release.
name: Proton release

on:
  schedule:
    # Every 6 hours, at :17. GitHub may delay scheduled runs under load.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Upstream ref to build from (branch, tag like 0.3.4, or commit).
          "latest-release" means the newest upstream GitHub release.
        default: latest-release
        type: string
      sync_fork:
        description: Merge upstream main into this fork's main first
        type: boolean
        default: true
      draft:
        description: Create the release as a draft (nothing is published)
        type: boolean
        default: false
      force:
        description: Release even if the upstream payload and sources are unchanged
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: proton-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: sdli1995/dlssg_for_sm86
  UPSTREAM_URL: https://github.com/sdli1995/dlssg_for_sm86.git
  # The upstream files that end up in the bundle.
  PAYLOAD_FILES: version.dll dlssg_sm86.ini
  # Bump when the bundle layout changes, so the change produces a release.
  PACKAGING_VERSION: "3"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve what to build
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          IN_REF: ${{ inputs.ref }}
          IN_SYNC: ${{ inputs.sync_fork }}
          IN_DRAFT: ${{ inputs.draft }}
          IN_FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ref=${IN_REF:-latest-release}
            sync=$IN_SYNC draft=$IN_DRAFT force=$IN_FORCE
          else
            # Scheduled poll: newest upstream release, publish, never force.
            ref=latest-release sync=true draft=false force=false
          fi

          if [ "$ref" = "latest-release" ]; then
            # Prefer the newest published GitHub release (the API skips drafts
            # and prereleases); fall back to the highest version tag if it is
            # unavailable. Both paths are validated, because a failing `gh api`
            # can put its error JSON on stdout.
            latest=""
            if api_out=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name 2>/dev/null); then
              latest=$(printf '%s' "$api_out" | grep -E '^v?[0-9]+(\.[0-9]+)+$' | head -n1 || true)
            fi
            if [ -z "$latest" ]; then
              latest=$(git ls-remote --tags --refs --sort=-v:refname "$UPSTREAM_URL" \
                | awk '{print $2}' | sed 's#^refs/tags/##' \
                | grep -E '^v?[0-9]+(\.[0-9]+)+$' | head -n1 || true)
            fi
            [ -n "$latest" ] || { echo "error: cannot determine the latest upstream release" >&2; exit 1; }
            ref=$latest
          fi

          {
            echo "ref=$ref"
            echo "sync_fork=$sync"
            echo "draft=$draft"
            echo "force=$force"
          } >>"$GITHUB_OUTPUT"
          {
            echo "### trigger"
            echo
            echo "| event | upstream ref | sync fork | draft | force |"
            echo "|---|---|---|---|---|"
            echo "| \`$EVENT\` | \`$ref\` | $sync | $draft | $force |"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Fetch the upstream ref and extract its payload
        id: upstream
        env:
          REF: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Lets README.md win over upstream's, per .gitattributes.
          git config merge.ours.driver true
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null \
            || git remote set-url upstream "$UPSTREAM_URL"

          git fetch --no-tags upstream "$REF"
          sha=$(git rev-parse 'FETCH_HEAD^{commit}')
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

          rm -rf upstream-files
          mkdir upstream-files
          read -ra files <<<"$PAYLOAD_FILES"
          git archive "$sha" "${files[@]}" THIRD_PARTY_NOTICES.txt README.en.md \
            | tar -x -C upstream-files
          # Only the files that end up in a bundle count as the payload.
          payload=$(cd upstream-files && sha256sum "${files[@]}" | sha256sum | cut -d' ' -f1)
          echo "payload_sha256=$payload" >>"$GITHUB_OUTPUT"
          echo "payload: $payload" >>"$GITHUB_STEP_SUMMARY"

      - name: Sync this fork with upstream main
        if: steps.resolve.outputs.sync_fork == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "main already contains upstream $(git rev-parse --short upstream/main)"
          else
            git merge --no-edit upstream/main
            git push origin main
          fi

      - name: Decide whether to build
        id: decide
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          PAYLOAD_SHA: ${{ steps.upstream.outputs.payload_sha256 }}
          FORCE: ${{ steps.resolve.outputs.force }}
        run: |
          set -euo pipefail
          read_state() { jq -r "$1 // empty" linux/state.json 2>/dev/null || true; }
          prev_payload=$(read_state .payload_sha256)
          prev_src=$(read_state .source_sha256)

          # Hash of everything this repo contributes to the bundle: the shim
          # sources, the installer and the bundle layout version. A change to
          # any of them makes the release worth rebuilding.
          src=$(
            {
              printf 'packaging %s\n' "$PACKAGING_VERSION"
              sha256sum linux/version_shim.c linux/version_shim.def linux/install.sh
            } | sha256sum | cut -d' ' -f1
          )

          # Upstream's version, from the first line of its English README
          # ("# DLSSG for SM86 (proxy) - 0.3.4 Version").
          version=$(head -n1 upstream-files/README.en.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)
          if [ -z "$version" ]; then
            version=$(git describe --tags --abbrev=0 "$UPSTREAM_SHA" | sed 's/^v//')
          fi

          build=false
          if [ "$prev_payload" != "$PAYLOAD_SHA" ]; then build=true; fi
          if [ "$prev_src" != "$src" ]; then build=true; fi
          if [ "$FORCE" = "true" ]; then build=true; fi

          # One release per upstream version: the tag never carries a counter,
          # so a rebuild updates the existing release instead of adding one.
          tag="proton-$version"

          {
            echo "build=$build"
            echo "version=$version"
            echo "tag=$tag"
            echo "source_sha256=$src"
          } >>"$GITHUB_OUTPUT"

          {
            echo "### $tag"
            echo
            echo "- upstream: \`$UPSTREAM_SHA\` (version $version)"
            echo "- payload: \`$PAYLOAD_SHA\`"
            echo "- sources: \`$src\`"
            echo "- building: $build"
            if [ "$build" = "false" ]; then
              echo
              echo "Nothing changed since the last release; re-run with \`force\` to rebuild anyway."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Install toolchain
        if: steps.decide.outputs.build == 'true'
        run: |
          sudo apt-get update -qq
          # `wine` (not just `wine64`) is what ships the /usr/bin launchers that
          # the smoke test needs; it pulls wine64 in as a dependency.
          sudo apt-get install -y -qq --no-install-recommends \
            mingw-w64 wine python3-pefile zip

      - name: Build shim
        if: steps.decide.outputs.build == 'true'
        run: ./linux/build.sh

      - name: Check export coverage against the upstream proxy
        if: steps.decide.outputs.build == 'true'
        run: python3 linux/verify-exports.py upstream-files/version.dll linux/out/version.dll

      - name: Wine smoke test
        if: steps.decide.outputs.build == 'true'
        id: smoke
        env:
          PROXY: upstream-files/version.dll
        run: |
          set -euo pipefail
          log=$(mktemp)
          # pipefail makes the script's exit code the pipeline's.
          ./linux/smoke-test.sh 2>&1 | tee "$log"
          needs=$(sed -n 's/^SMOKE_NEEDS_SHIM=//p' "$log" | tail -n1)
          [ -n "$needs" ] || { echo "error: smoke test did not report SMOKE_NEEDS_SHIM" >&2; exit 1; }
          echo "needs_shim=$needs" >>"$GITHUB_OUTPUT"
          if [ "$needs" = "yes" ]; then
            echo "shim: required (this upstream proxy aborts under Wine without it)" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "shim: optional (this upstream proxy starts under Wine without it)" >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Package release bundle
        if: steps.decide.outputs.build == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          dir="dlssg-sm86-proton-$VERSION"
          rm -rf dist
          mkdir -p "dist/$dir/game-dir" "dist/$dir/system32"

          # Upstream's runtime, and its licence notice beside the DLL it covers.
          cp upstream-files/version.dll upstream-files/dlssg_sm86.ini \
             upstream-files/THIRD_PARTY_NOTICES.txt "dist/$dir/game-dir/"
          cp linux/out/version.dll "dist/$dir/system32/version.dll"
          cp linux/install.sh "dist/$dir/install.sh"
          chmod +x "dist/$dir/install.sh"

          # SHA256SUMS is uploaded as its own release asset, so it is written
          # outside the bundle directory and never lands in the zip.
          ( cd "dist/$dir" && find . -type f -print0 | sort -z \
              | xargs -0 sha256sum >../SHA256SUMS )
          ( cd dist && zip -qr "$dir.zip" "$dir" )

          {
            echo "### bundle"
            echo
            echo '```'
            ( cd "dist/$dir" && find . -type f | sort )
            echo '```'
            echo
            cat "dist/SHA256SUMS"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Create or refresh the release
        if: steps.decide.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.decide.outputs.tag }}
          VERSION: ${{ steps.decide.outputs.version }}
          SHA: ${{ steps.upstream.outputs.sha }}
          PAYLOAD_SHA: ${{ steps.upstream.outputs.payload_sha256 }}
          SOURCE_SHA: ${{ steps.decide.outputs.source_sha256 }}
          NEEDS_SHIM: ${{ steps.smoke.outputs.needs_shim }}
          DRAFT: ${{ steps.resolve.outputs.draft }}
        run: |
          set -euo pipefail
          dir="dlssg-sm86-proton-$VERSION"
          zip="dist/$dir.zip"

          if [ "$NEEDS_SHIM" = "yes" ]; then
            shim_note="required (the proxy does not start under Wine without it)"
          else
            shim_note="optional (the proxy starts under Wine without it)"
          fi

          # linux/release-notes.template.md holds the wording, so the markdown
          # (and its backticks) never goes through shell quoting.
          sed -e "s|@REPO@|$GITHUB_REPOSITORY|g" \
              -e "s|@UPSTREAM_REPO@|$UPSTREAM_REPO|g" \
              -e "s|@SHA7@|${SHA:0:7}|g" \
              -e "s|@SHA@|$SHA|g" \
              -e "s|@VERSION@|$VERSION|g" \
              -e "s|@SHIM_NOTE@|$shim_note|g" \
              -e "s|@PAYLOAD@|$PAYLOAD_SHA|g" \
              -e "s|@SOURCE_SHA@|$SOURCE_SHA|g" \
              linux/release-notes.template.md >release-notes.md

          # --repo is explicit: the `upstream` remote added earlier would
          # otherwise make gh resolve to the upstream repository.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" "$zip" "dist/SHA256SUMS" \
              --repo "$GITHUB_REPOSITORY" --clobber
            if [ "$DRAFT" = "true" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft
            else
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
            fi
            echo "refreshed the existing $TAG release"
          else
            args=(--title "$TAG" --notes-file release-notes.md --target "$(git rev-parse HEAD)")
            if [ "$DRAFT" = "true" ]; then args+=(--draft); fi
            gh release create "$TAG" "$zip" "dist/SHA256SUMS" \
              --repo "$GITHUB_REPOSITORY" "${args[@]}"
          fi

      - name: Record release state
        if: steps.decide.outputs.build == 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
          VERSION: ${{ steps.decide.outputs.version }}
          REF: ${{ steps.resolve.outputs.ref }}
          SHA: ${{ steps.upstream.outputs.sha }}
          PAYLOAD_SHA: ${{ steps.upstream.outputs.payload_sha256 }}
          SRC: ${{ steps.decide.outputs.source_sha256 }}
          NEEDS_SHIM: ${{ steps.smoke.outputs.needs_shim }}
        run: |
          set -euo pipefail
          jq -n \
            --arg repo "$UPSTREAM_REPO" \
            --arg ref "$REF" \
            --arg sha "$SHA" \
            --arg version "$VERSION" \
            --arg payload "$PAYLOAD_SHA" \
            --arg tag "$TAG" \
            --arg src "$SRC" \
            --arg needs_shim "$NEEDS_SHIM" \
            --arg shim_sha256 "$(sha256sum linux/out/version.dll | cut -d' ' -f1)" \
            --arg released_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{upstream_repo: $repo, upstream_ref: $ref, upstream_sha: $sha,
              upstream_version: $version, payload_sha256: $payload,
              tag: $tag, source_sha256: $src, shim_sha256: $shim_sha256,
              shim_required: $needs_shim, released_at: $released_at}' \
            >linux/state.json
          cat linux/state.json
          git add linux/state.json
          git commit -m "ci: release $TAG (upstream ${SHA:0:7})"
          git push origin main

      - name: Record scheduled check
        # GitHub disables scheduled workflows after 60 days without repository
        # activity, so an idle fork would silently stop noticing upstream
        # releases. Refresh a timestamp at most once a week to keep the poll
        # alive; skipped when this run already pushed a release commit.
        if: >-
          always() && github.event_name == 'schedule'
          && steps.decide.outputs.build != 'true'
          && steps.resolve.outputs.ref != ''
        env:
          REF: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          prev=$(jq -r '.pushed_at // empty' linux/heartbeat.json 2>/dev/null || true)
          if [ -n "$prev" ]; then
            age=$(( $(date -u +%s) - $(date -u -d "$prev" +%s) ))
            if [ "$age" -lt 604800 ]; then
              echo "heartbeat is fresh ($prev, ${age}s ago); nothing to push"
              exit 0
            fi
          fi
          jq -n --arg checked "$now" --arg tag "$REF" \
            '{checked_at: $checked, upstream_ref: $tag, pushed_at: $checked}' \
            >linux/heartbeat.json
          git add linux/heartbeat.json
          git commit -m "ci: heartbeat $now (upstream $REF)"
          git push origin main
